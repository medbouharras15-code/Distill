name: Team Brain — tests automatisés

# Lance toute la suite tests/team-brain-*.test.ts contre le projet Supabase
# de TEST (jamais la production) dont les identifiants sont stockés dans les
# secrets GitHub ci-dessous. Se lance automatiquement quand ces fichiers
# changent, et peut aussi être relancé à la main depuis l'onglet Actions
# (bouton "Run workflow") — pratique quand on n'a pas de terminal sous la
# main (ex. depuis Safari sur iPad).
#
# Secrets requis (Settings → Secrets and variables → Actions → New repository
# secret) :
#   - SUPABASE_TEST_URL, NEXT_PUBLIC_SUPABASE_ANON_KEY, SUPABASE_SERVICE_ROLE_KEY
#     → à copier depuis le projet Supabase de TEST, pas celui de prod.
#   - VOYAGE_API_KEY → clé Voyage AI (voyageai.com), utilisée par
#     tests/team-brain-indexing.test.ts et tests/team-brain-search.test.ts
#     pour générer de vrais embeddings. Sans elle, seule la partie chunkPages
#     (sans réseau) s'exécute.

on:
  push:
    paths:
      - "tests/**"
      - "src/lib/teamBrain*.ts"
      - "src/app/api/team-brain/**"
      - "supabase/schema.sql"
      - "vitest.config.mts"
      - "package.json"
      - ".github/workflows/team-brain-rls-tests.yml"
  workflow_dispatch: {}

jobs:
  team-brain-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - run: npm ci

      - name: Lancer les tests Team Brain
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_TEST_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          VOYAGE_API_KEY: ${{ secrets.VOYAGE_API_KEY }}
        run: npm test
